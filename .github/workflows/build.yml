name: Build Moody Glow

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: kujto/theos-action@main
        with:
          theos-path: ${{ github.workspace }}/theos

      - name: Build Tweak
        run: |
          export THEOS=${{ github.workspace }}/theos
          make clean
          make package

      - name: Upload Deb
        uses: actions/upload-artifact@v4
        with:
          name: MoodyGlow-Deb
          path: .theos/_/*.deb
